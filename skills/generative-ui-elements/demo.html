<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="ugu-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generative UI Elements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./generative-ui.css" />
    <style>
      :root,
      [data-theme="dark"] {
        --bg: #0e0e0d;
        --surface: #171716;
        --raised: #201f1d;
        --fg: #ecebe6;
        --fg-2: #bdbbb3;
        --muted: #85837b;
        --hair: rgba(236, 235, 230, 0.1);
        --accent: #ff5a1f;
        color-scheme: dark;
      }
      [data-theme="light"] {
        --bg: #f3f2ee;
        --surface: #ffffff;
        --raised: #e9e8e2;
        --fg: #161615;
        --fg-2: #4a4944;
        --muted: #7a786f;
        --hair: rgba(22, 22, 21, 0.1);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: "Instrument Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .serif {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        letter-spacing: -0.015em;
      }
      .mono {
        font-family: "DM Mono", ui-monospace, monospace;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 32px;
      }
      .logo {
        font-size: 28px;
      }
      .logo span {
        color: var(--accent);
      }
      .controls {
        display: flex;
        gap: 18px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .controls button {
        all: unset;
        cursor: pointer;
        color: var(--muted);
      }
      .controls button:hover {
        color: var(--fg);
      }
      h1 {
        margin: 24px 0 8px;
        text-align: center;
        font-size: clamp(44px, 7vw, 76px);
        line-height: 0.95;
      }
      .sub {
        text-align: center;
        color: var(--fg-2);
        margin: 0 0 56px;
      }
      /* The export frame: only the UI, on the page background. */
      .stage {
        position: relative;
        margin: 0 auto 80px;
        width: min(1200px, calc(100vw - 48px));
        aspect-ratio: 16 / 9;
        display: flex;
        gap: 40px;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }
      .card {
        position: relative;
        width: 300px;
        border-radius: 20px;
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--hair);
        padding: 20px;
      }
      .tag {
        font-family: "DM Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .title {
        font-size: 30px;
        margin: 14px 0 6px;
      }
      .meta {
        font-size: 13.5px;
        color: var(--fg-2);
      }
      .pill {
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 11px;
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent);
      }
      .btns {
        display: flex;
        gap: 8px;
        margin-top: 18px;
      }
      .btn {
        flex: 1;
        height: 42px;
        border: 0;
        border-radius: 12px;
        font: 500 14px "Instrument Sans", sans-serif;
        background: var(--raised);
        color: var(--fg);
      }
      .btn.primary {
        background: var(--fg);
        color: var(--bg);
      }
      .bars {
        display: flex;
        align-items: end;
        gap: 4px;
        height: 64px;
        margin-top: 16px;
      }
      .bars span {
        flex: 1;
        border-radius: 3px;
        background: var(--raised);
      }
      .bars span.hot {
        background: var(--accent);
      }
      .big {
        font-size: 56px;
        line-height: 1;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo serif">Generative UI<span>.</span></div>
      <div class="controls mono">
        <button id="build">Build</button>
        <button id="texts">Build + texts</button>
        <button id="theme">Light</button>
        <button id="export">Export 16:9</button>
      </div>
    </header>
    <h1 class="serif">Motion, <em>taken apart.</em></h1>
    <p class="sub">Each card is traced from its own parts, then set for real.</p>

    <div class="stage" id="stage">
      <!-- Marked: data-part tells the runtime exactly what to build and in what order. -->
      <div class="card" id="event">
        <div class="row">
          <span class="tag" data-part="text">Thu 14 · 2:00 PM</span>
          <span class="pill mono" data-part="frame" data-name="status">On time</span>
        </div>
        <div class="title serif" data-part="text">Launch review</div>
        <div class="meta" data-part="text">Studio 4, 210 Market St</div>
        <div class="bars" data-part="frame" data-name="attendance">
          <span style="height: 40%"></span><span style="height: 70%"></span><span class="hot" style="height: 95%"></span><span style="height: 55%"></span><span style="height: 30%"></span><span style="height: 65%"></span>
        </div>
        <div class="btns">
          <button class="btn primary" data-part="button">Join</button>
          <button class="btn" data-part="button">Decline</button>
        </div>
      </div>

      <!-- Unmarked: parts are detected from the DOM (text, filled boxes, buttons, svg). -->
      <div class="card" id="weather">
        <div class="row">
          <div>
            <div style="font-weight: 600">San Francisco</div>
            <div class="tag">Monday</div>
          </div>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </div>
        <div class="big serif">24°</div>
        <div class="row meta" style="margin-top: 8px"><span>Clear and warm</span><span class="mono">26° / 17°</span></div>
        <div class="btns"><button class="btn primary">Mon</button><button class="btn">Tue</button><button class="btn">Wed</button></div>
      </div>
    </div>

    <script type="module">
      import { form } from "./generative-ui.js";
      import { canRecord, exportVideo } from "./generative-ui-record.js";

      const cards = [document.getElementById("event"), document.getElementById("weather")];
      const recipes = [
        { comment: "rsvp morph", selector: ".rsvp", vars: { "--text-morph-dur": "200ms", "--resize-dur": "300ms" } },
        { comment: "attendance bars", selector: ".bars", vars: { "--bar-dur": "520ms", "--bar-stagger": "18ms", "--bar-ease": "cubic-bezier(0.16, 1, 0.3, 1)" } },
      ];
      let runs = [];
      // Several cards: build only, staggered. One card: the texts fit beside it.
      const play = (mode, delay = 0) => {
        runs.forEach((r) => r.cancel());
        if (mode === "texts") {
          cards[1].style.display = "none";
          runs = [form(cards[0], { mode, recipes, title: "event", delay })];
        } else {
          cards[1].style.display = "";
          runs = cards.map((c, i) => form(c, { delay: delay + i * 260 }));
        }
        return Promise.all(runs.map((r) => r.finished));
      };

      document.fonts.ready.then(() => play("build"));
      document.getElementById("build").onclick = () => play("build");
      document.getElementById("texts").onclick = () => play("texts");
      const themeBtn = document.getElementById("theme");
      themeBtn.onclick = () => {
        const light = document.documentElement.dataset.theme !== "light";
        document.documentElement.dataset.theme = light ? "light" : "dark";
        themeBtn.textContent = light ? "Dark" : "Light";
      };
      const exp = document.getElementById("export");
      if (!canRecord()) exp.style.display = "none";
      exp.onclick = () =>
        exportVideo({
          frame: document.getElementById("stage"),
          size: { w: 1920, h: 1080 },
          play: (delay) => play("build", delay),
          filename: "generative-ui-16x9",
        }).catch((e) => alert(e.message));
    </script>
  </body>
</html>
